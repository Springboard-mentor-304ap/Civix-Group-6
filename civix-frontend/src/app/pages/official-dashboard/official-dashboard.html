<div class="dashboard-container">
  <!-- Sidebar / Navigation -->
  <aside class="sidebar">
    <div class="brand">
      <div class="seal">
        <span>C</span>
      </div>
      <div>
        <h2>CIVIX</h2>
        <small>Official Panel</small>
      </div>
    </div>

    <nav class="nav-links">
      <a routerLink="/official-dashboard" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active" class="nav-item">
        <span class="icon">📊</span> Dashboard
      </a>
      <a routerLink="/official-dashboard/petitions" routerLinkActive="active" class="nav-item">
        <span class="icon">📜</span> Petitions Mgt
      </a>
      <a routerLink="/official-dashboard/polls" routerLinkActive="active" class="nav-item">
        <span class="icon">🗳️</span> Polls Mgt
      </a>
      <a routerLink="/official-dashboard/queries" routerLinkActive="active" class="nav-item">
        <span class="icon">💬</span> Citizen Queries
      </a>
      <a routerLink="/official-dashboard/reports" routerLinkActive="active" class="nav-item">
        <span class="icon">📈</span> Reports & Analytics
      </a>
      <a routerLink="/official-dashboard/profile" routerLinkActive="active" class="nav-item">
        <span class="icon">👤</span> Profile
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="onLogout()">
        <span class="icon">🚪</span> Log Out
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
